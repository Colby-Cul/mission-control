<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control - Auth Test</title>
</head>
<body>
    <h1>Mission Control Authentication Test</h1>
    
    <div id="loginForm">
        <h2>Login Test</h2>
        <input type="text" id="username" placeholder="Username" value="colby">
        <input type="password" id="password" placeholder="Password" value="MissionControl2026!">
        <button onclick="testLogin()">Test Login</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const results = document.getElementById('results');
            
            try {
                const response = await fetch('/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    results.innerHTML = `
                        <h3 style="color: green;">✅ Login Successful!</h3>
                        <p>Token: ${data.token}</p>
                        <button onclick="testDashboard('${data.token}')">Test Dashboard Access</button>
                    `;
                } else {
                    results.innerHTML = `<h3 style="color: red;">❌ Login Failed: ${data.message}</h3>`;
                }
            } catch (error) {
                results.innerHTML = `<h3 style="color: red;">❌ Error: ${error.message}</h3>`;
            }
        }
        
        async function testDashboard(token) {
            try {
                const response = await fetch('/', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Cookie': `auth_token=${token}`
                    }
                });
                
                if (response.ok) {
                    const html = await response.text();
                    if (html.includes('Mission Control')) {
                        document.getElementById('results').innerHTML += `
                            <h3 style="color: green;">✅ Dashboard Access Successful!</h3>
                            <p><a href="/?token=${token}" target="_blank">Open Mission Control Dashboard</a></p>
                        `;
                    } else {
                        document.getElementById('results').innerHTML += `<h3 style="color: orange;">⚠️ Got response but not dashboard</h3>`;
                    }
                } else {
                    document.getElementById('results').innerHTML += `<h3 style="color: red;">❌ Dashboard access failed: ${response.status}</h3>`;
                }
            } catch (error) {
                document.getElementById('results').innerHTML += `<h3 style="color: red;">❌ Dashboard error: ${error.message}</h3>`;
            }
        }
    </script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        input { display: block; margin: 10px 0; padding: 5px; width: 200px; }
        button { padding: 10px 20px; margin: 10px 0; }
        #results { margin-top: 20px; padding: 20px; border: 1px solid #ccc; }
    </style>
</body>
</html>
