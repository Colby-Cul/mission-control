<!DOCTYPE html>
<html>
<head>
    <title>Mission Control - Quick Access</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a2e; 
            color: white; 
            padding: 40px; 
            text-align: center; 
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #16213e;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #2d2d44;
        }
        .btn { 
            background: #8b5cf6; 
            color: white; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            cursor: pointer; 
            margin: 15px 5px; 
            display: inline-block;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background: #7c3aed; }
        .btn:disabled { 
            background: #4b5563; 
            cursor: not-allowed; 
        }
        h1 { color: #8b5cf6; margin-bottom: 1rem; }
        .status {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .success { 
            background: rgba(34, 197, 94, 0.2); 
            color: #86efac; 
            border: 1px solid rgba(34, 197, 94, 0.5); 
        }
        .error { 
            background: rgba(239, 68, 68, 0.2); 
            color: #fca5a5; 
            border: 1px solid rgba(239, 68, 68, 0.5); 
        }
        .loading { 
            background: rgba(59, 130, 246, 0.2); 
            color: #93c5fd; 
            border: 1px solid rgba(59, 130, 246, 0.5); 
        }
        .direct-url {
            background: #2d2d44;
            color: #fcd34d;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            border: 1px solid #4b5563;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Mission Control</h1>
        <p>Click below for instant dashboard access:</p>
        
        <button class="btn" id="mainBtn" onclick="quickAccess()">
            🎯 Access Dashboard Now
        </button>
        
        <div id="statusDiv"></div>
        
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #2d2d44;">
            <p style="font-size: 14px; color: #9ca3af; margin-bottom: 15px;">Alternative methods:</p>
            
            <button class="btn" style="font-size: 14px; padding: 10px 20px;" onclick="getDirectUrl()">
                🔑 Get Direct URL
            </button>
            
            <button class="btn" style="font-size: 14px; padding: 10px 20px;" onclick="openLoginPage()">
                🔐 Standard Login
            </button>
        </div>
        
        <div id="directUrlDiv" style="display: none;">
            <p><strong>Direct Access URL:</strong></p>
            <div class="direct-url" id="directUrl"></div>
            <button class="btn" onclick="copyUrl()">📋 Copy</button>
            <button class="btn" onclick="openUrl()">🚀 Open</button>
        </div>
        
        <div style="margin-top: 30px; font-size: 12px; color: #6b7280;">
            <div>Server: <span id="hostInfo"></span></div>
            <div>Status: <span id="healthStatus">Checking...</span></div>
        </div>
    </div>

    <script>
        let directAccessUrl = null;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('hostInfo').textContent = window.location.host;
            checkHealth();
        });
        
        async function checkHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                document.getElementById('healthStatus').innerHTML = `<span style="color: #10b981;">✅ ${data.status}</span>`;
            } catch (error) {
                document.getElementById('healthStatus').innerHTML = `<span style="color: #ef4444;">❌ ${error.message}</span>`;
            }
        }
        
        async function quickAccess() {
            const btn = document.getElementById('mainBtn');
            const statusDiv = document.getElementById('statusDiv');
            
            try {
                btn.disabled = true;
                btn.textContent = '🔄 Authenticating...';
                
                statusDiv.innerHTML = '<div class="loading">🔄 Connecting to Mission Control...</div>';
                
                // Auth request
                const response = await fetch('/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: 'colby', 
                        password: 'MissionControl2026!' 
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status} ${response.statusText}`);
                }
                
                const result = await response.json();
                
                if (result.success && result.token) {
                    statusDiv.innerHTML = '<div class="success">✅ Authentication successful! Redirecting...</div>';
                    btn.textContent = '✅ Success!';
                    
                    // Redirect with token
                    setTimeout(() => {
                        window.location.href = `/?token=${result.token}`;
                    }, 1500);
                    
                } else {
                    throw new Error(result.message || 'Authentication failed');
                }
                
            } catch (error) {
                console.error('Quick access error:', error);
                statusDiv.innerHTML = `
                    <div class="error">
                        <strong>❌ Access Failed:</strong><br>
                        ${error.message}<br><br>
                        <small>Try the alternative methods below or refresh the page.</small>
                    </div>
                `;
                btn.textContent = '❌ Try Again';
                btn.disabled = false;
            }
        }
        
        async function getDirectUrl() {
            const statusDiv = document.getElementById('statusDiv');
            const directUrlDiv = document.getElementById('directUrlDiv');
            
            try {
                statusDiv.innerHTML = '<div class="loading">🔑 Getting access token...</div>';
                
                const response = await fetch('/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: 'colby', 
                        password: 'MissionControl2026!' 
                    })
                });
                
                const result = await response.json();
                
                if (result.success && result.token) {
                    directAccessUrl = `${window.location.origin}/?token=${result.token}`;
                    document.getElementById('directUrl').textContent = directAccessUrl;
                    directUrlDiv.style.display = 'block';
                    statusDiv.innerHTML = '<div class="success">✅ Direct URL generated successfully!</div>';
                } else {
                    throw new Error(result.message || 'Failed to generate URL');
                }
                
            } catch (error) {
                statusDiv.innerHTML = `<div class="error">❌ URL generation failed: ${error.message}</div>`;
            }
        }
        
        function copyUrl() {
            if (directAccessUrl) {
                navigator.clipboard.writeText(directAccessUrl).then(() => {
                    document.getElementById('statusDiv').innerHTML = '<div class="success">📋 URL copied to clipboard!</div>';
                }).catch(() => {
                    // Fallback
                    const textArea = document.createElement('textarea');
                    textArea.value = directAccessUrl;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    document.getElementById('statusDiv').innerHTML = '<div class="success">📋 URL copied!</div>';
                });
            }
        }
        
        function openUrl() {
            if (directAccessUrl) {
                window.open(directAccessUrl, '_blank');
            }
        }
        
        function openLoginPage() {
            window.location.href = '/login';
        }
    </script>
</body>
</html>
