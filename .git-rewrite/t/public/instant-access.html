<!DOCTYPE html>
<html>
<head>
    <title>Mission Control - Instant Access</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; padding: 50px; text-align: center; }
        .btn { background: #8b5cf6; color: white; padding: 20px 40px; border: none; border-radius: 8px; font-size: 20px; cursor: pointer; margin: 10px; text-decoration: none; display: inline-block; }
        .btn:hover { background: #7c3aed; }
        h1 { color: #8b5cf6; }
    </style>
</head>
<body>
    <h1>🚀 Mission Control - Instant Access</h1>
    <p>Click below to get immediate access to your Mission Control dashboard:</p>
    
    <script>
        async function instantAccess() {
            const button = document.querySelector('.btn');
            const originalText = button.innerHTML;
            
            try {
                // Show loading state
                button.innerHTML = '🔄 Authenticating...';
                button.disabled = true;
                
                console.log('Starting authentication...');
                
                // Get auth token with detailed error handling
                const authResponse = await fetch('/auth', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username: 'colby', password: 'MissionControl2026!' }),
                    credentials: 'same-origin'
                });
                
                console.log('Auth response status:', authResponse.status);
                
                if (!authResponse.ok) {
                    throw new Error(`HTTP ${authResponse.status}: ${authResponse.statusText}`);
                }
                
                const authResult = await authResponse.json();
                console.log('Auth result:', authResult);
                
                if (authResult.success && authResult.token) {
                    button.innerHTML = '✅ Success! Redirecting...';
                    console.log('Redirecting with token:', authResult.token.substring(0, 10) + '...');
                    
                    // Multiple redirect attempts for reliability
                    setTimeout(() => {
                        window.location.href = `/?token=${authResult.token}`;
                    }, 500);
                    
                    // Fallback redirect
                    setTimeout(() => {
                        if (window.location.pathname === '/instant-access.html') {
                            window.location.replace(`/?token=${authResult.token}`);
                        }
                    }, 2000);
                    
                } else {
                    throw new Error(authResult.message || 'Authentication failed - no token received');
                }
                
            } catch (error) {
                console.error('Authentication error:', error);
                button.innerHTML = '❌ Error - Try Again';
                button.disabled = false;
                
                // Show detailed error
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = 'background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 500px; font-size: 14px;';
                errorDiv.innerHTML = `
                    <strong>Connection Error:</strong><br>
                    ${error.message}<br><br>
                    <strong>Troubleshooting:</strong><br>
                    • Check if Mission Control server is running<br>
                    • Try refreshing the page<br>
                    • Check network connection<br>
                    <br>
                    <button onclick="location.reload()" style="background: #8b5cf6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">🔄 Reload Page</button>
                `;
                
                document.body.appendChild(errorDiv);
                
                // Reset button after delay
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.disabled = false;
                }, 3000);
            }
        }
        
        // Test connection on page load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const healthCheck = await fetch('/health');
                const health = await healthCheck.json();
                console.log('Server health:', health);
                
                // Show server status
                const statusDiv = document.createElement('div');
                statusDiv.style.cssText = 'background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); color: #86efac; padding: 10px; border-radius: 8px; margin: 20px auto; max-width: 400px; font-size: 12px;';
                statusDiv.innerHTML = `✅ Server Status: ${health.status} | Version: ${health.version}`;
                document.body.appendChild(statusDiv);
                
            } catch (error) {
                console.warn('Health check failed:', error);
                
                const warningDiv = document.createElement('div');
                warningDiv.style.cssText = 'background: rgba(245, 158, 11, 0.2); border: 1px solid rgba(245, 158, 11, 0.5); color: #fcd34d; padding: 10px; border-radius: 8px; margin: 20px auto; max-width: 400px; font-size: 12px;';
                warningDiv.innerHTML = `⚠️ Server connection issue detected - try the access button anyway`;
                document.body.appendChild(warningDiv);
            }
        });
    </script>
    
    <button class="btn" onclick="instantAccess()">🎯 Access Mission Control Now</button>
    
    <p style="margin-top: 40px; font-size: 14px; color: #888;">
        This bypasses all login forms and gets you direct access to the dashboard.
    </p>
</body>
</html>
