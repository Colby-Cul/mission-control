<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control - Quick Login Fix</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a2e; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
        }
        .login-box { 
            background: #16213e; 
            padding: 2rem; 
            border-radius: 10px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        input { 
            display: block; 
            width: 250px; 
            margin: 10px auto; 
            padding: 10px; 
            font-size: 16px;
            border: 1px solid #444;
            background: #2d3748;
            color: #fff;
            border-radius: 5px;
        }
        button { 
            background: #8b5cf6; 
            color: white; 
            padding: 12px 30px; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 15px;
        }
        button:hover { background: #7c3aed; }
        .error { color: #ff6b6b; margin: 10px 0; }
        .success { color: #51cf66; margin: 10px 0; }
        h1 { color: #8b5cf6; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🚀 Mission Control</h1>
        <div id="message"></div>
        <input type="text" id="username" placeholder="Username" value="colby">
        <input type="password" id="password" placeholder="Password" value="MissionControl2026!">
        <button onclick="login()">Access Mission Control</button>
        <p style="margin-top: 20px; font-size: 12px; color: #888;">
            Quick login fix - no cookie issues
        </p>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            
            message.innerHTML = '<div style="color: #ffd93d;">🔄 Authenticating...</div>';
            
            try {
                const response = await fetch('/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    message.innerHTML = '<div class="success">✅ Success! Redirecting...</div>';
                    
                    // Redirect with token in URL (bypass cookie issues)
                    setTimeout(() => {
                        window.location.href = `/?token=${result.token}`;
                    }, 1000);
                    
                } else {
                    message.innerHTML = `<div class="error">❌ ${result.message || 'Login failed'}</div>`;
                }
            } catch (error) {
                message.innerHTML = `<div class="error">❌ Connection error: ${error.message}</div>`;
            }
        }
        
        // Allow Enter key to submit
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
