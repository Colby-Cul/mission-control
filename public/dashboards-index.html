<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background: #060610; color: #fff; min-height: 100vh;
    font-family: 'DM Sans', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center; padding: 40px 20px;
  }
  .wrap { max-width: 1000px; width: 100%; }
  h1 {
    font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #fff 0%, #a78bfa 50%, #ec4899 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  p.sub { color: #64748b; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
  a.tile {
    display: block; text-decoration: none;
    padding: 28px; border-radius: 18px;
    background: rgba(139,92,246,0.06);
    border: 1px solid rgba(139,92,246,0.18);
    transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  a.tile::before {
    content:''; position:absolute; inset:0;
    background: radial-gradient(120% 80% at 100% 0%, rgba(236,72,153,0.08), transparent 60%);
    pointer-events:none;
  }
  a.tile:hover { transform: translateY(-4px); border-color: rgba(236,72,153,0.4); }
  .icon { font-size: 28px; margin-bottom: 14px; }
  .name { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 6px; letter-spacing: -0.01em; }
  .desc { font-size: 12px; color: #64748b; line-height: 1.5; }
  .arrow { margin-top: 16px; font-size: 11px; color: #a78bfa; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .live-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#10b981; box-shadow:0 0 10px #10b981; margin-right:6px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="sub"><span class="live-dot"></span>LIVE · Mission Control</p>
  <h1>Command Center</h1>
  <p style="color:#94a3b8;font-size:15px;margin-bottom:36px;">CEO operations · cash flow · entity ownership</p>

  <div class="grid">
    <a class="tile" href="/finance">
      <div class="icon">💰</div>
      <div class="name">Finance</div>
      <div class="desc">Net worth, cash flow, entity rollups, dividends</div>
      <div class="arrow">Open →</div>
    </a>
    <a class="tile" href="/xome">
      <div class="icon">🏦</div>
      <div class="name">Xome Home</div>
      <div class="desc">Mortgage vertical · loans funded · pipeline</div>
      <div class="arrow">Open →</div>
    </a>
    <a class="tile" href="/company">
      <div class="icon">🏢</div>
      <div class="name">Company</div>
      <div class="desc">Entity dashboard template · ownership editor</div>
      <div class="arrow">Open →</div>
    </a>
  </div>
</div>
</body>
</html>
